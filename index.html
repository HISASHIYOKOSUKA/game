<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>エクリプス・サーガ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b1736">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* 画面構成：縦長スマホ1画面。上にゲーム画面、下に操作パッド（フィールド）／コマンド窓（バトル） */
:root {
  --night: #0b1736;      /* 背景の夜空色 */
  --panel: #10265a;      /* ウィンドウ地 */
  --panel-2: #183474;
  --edge: #8fb8ff;       /* ウィンドウの縁 */
  --ink: #f2f5ff;        /* 文字 */
  --ink-dim: #9fb2dc;
  --gold: #ffd75e;       /* 選択・強調 */
  --hp: #4fdc7a;
  --mp: #5aa8ff;
  --danger: #ff6b6b;
  --font: "DotGothic16", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.45;
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#app {
  position: relative; height: 100%; max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px; box-sizing: border-box;
}
.view { height: 100%; display: flex; flex-direction: column; gap: 8px; }
.win {
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 2px solid var(--edge); border-radius: 6px;
  box-shadow: 0 0 0 2px #050b1c, inset 0 0 0 1px rgba(255,255,255,0.08);
}
.bar { display: block; height: 5px; background: #061026; border-radius: 3px; overflow: hidden; flex: 1; min-width: 0; }
.bar b { display: block; height: 100%; width: 100%; transition: width .35s ease; }
.bar.hp b { background: var(--hp); }
.bar.mp b { background: var(--mp); }

/* ---------- フィールド ---------- */
#hud { display: flex; flex-direction: column; gap: 6px; padding: 6px 8px; }
#hud-party { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.mini { display: flex; gap: 4px; align-items: center; min-width: 0; }
.mini img { width: 28px; height: 28px; border-radius: 4px; border: 1px solid var(--edge); object-fit: cover; flex: none; }
.mini-bars { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.mini-name { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-dim); }
.mini.dead img { filter: grayscale(1); opacity: .5; }
.hud-line { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-dim); }
#zone-danger { color: var(--gold); letter-spacing: .1em; margin-left: 6px; }
#gold { color: var(--gold); font-variant-numeric: tabular-nums; }
#field-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 4px; }
#field { border: 2px solid var(--edge); box-shadow: 0 0 0 2px #050b1c; touch-action: none; }
#toast {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  background: rgba(8,16,40,.88); border: 1px solid var(--edge); border-radius: 4px;
  padding: 6px 12px; font-size: 13px; white-space: nowrap; pointer-events: none;
}
#controls {
  flex: none; display: flex; justify-content: space-between; align-items: center;
  padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px));
}
#dpad {
  position: relative; width: 156px; height: 156px; border-radius: 50%;
  background: radial-gradient(circle, #1b3570 0%, #0f2350 70%);
  border: 2px solid var(--edge); box-shadow: 0 0 0 2px #050b1c, inset 0 2px 8px rgba(0,0,0,.5);
  touch-action: none;
}
#dpad span {
  position: absolute; width: 0; height: 0; border: 14px solid transparent; opacity: .75;
  transition: opacity .1s, transform .1s;
}
#dpad .u { left: 50%; top: 14px; transform: translateX(-50%); border-bottom: 20px solid var(--ink); border-top: 0; }
#dpad .d { left: 50%; bottom: 14px; transform: translateX(-50%); border-top: 20px solid var(--ink); border-bottom: 0; }
#dpad .l { top: 50%; left: 14px; transform: translateY(-50%); border-right: 20px solid var(--ink); border-left: 0; }
#dpad .r { top: 50%; right: 14px; transform: translateY(-50%); border-left: 20px solid var(--ink); border-right: 0; }
#dpad[data-dir="up"] .u, #dpad[data-dir="down"] .d, #dpad[data-dir="left"] .l, #dpad[data-dir="right"] .r { opacity: 1; filter: drop-shadow(0 0 6px var(--gold)); }
#dpad[data-dir="up"] .u { border-bottom-color: var(--gold); }
#dpad[data-dir="down"] .d { border-top-color: var(--gold); }
#dpad[data-dir="left"] .l { border-right-color: var(--gold); }
#dpad[data-dir="right"] .r { border-left-color: var(--gold); }
#dpad::after { content: ""; position: absolute; inset: 50%; width: 26px; height: 26px; margin: -13px; border-radius: 50%; background: #0a1838; border: 1px solid rgba(143,184,255,.4); }
.side-btns { display: flex; flex-direction: column; gap: 14px; align-items: flex-end; }
.round {
  width: 84px; height: 84px; border-radius: 50%; font-size: 15px;
  background: radial-gradient(circle at 35% 30%, #2a4c98, #12285e);
  border: 2px solid var(--edge); box-shadow: 0 0 0 2px #050b1c, 0 4px 0 #050b1c;
}
.round:active { transform: translateY(2px); box-shadow: 0 0 0 2px #050b1c, 0 2px 0 #050b1c; }
.round.small { width: 66px; height: 66px; font-size: 13px; }
.round.on { background: radial-gradient(circle at 35% 30%, #a07a18, #5a4208); border-color: var(--gold); }

/* ---------- バトル ---------- */
#battle-wrap { flex: none; }
#battle { border: 2px solid var(--edge); box-shadow: 0 0 0 2px #050b1c; touch-action: none; }
#msg {
  flex: none; min-height: 3.2em; padding: 8px 12px; white-space: pre-line; font-size: 14px; position: relative;
}
#msg.wait::after { content: "▼"; position: absolute; right: 10px; bottom: 4px; color: var(--gold); animation: blink .8s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#bpanel { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 8px; padding-bottom: env(safe-area-inset-bottom, 0px); }
#cmd { display: flex; flex-direction: column; gap: 4px; padding: 6px; overflow-y: auto; }
.cmd-title { font-size: 11px; color: var(--ink-dim); padding: 0 4px; }
.cmd-btn {
  display: flex; justify-content: space-between; align-items: baseline; gap: 6px;
  text-align: left; padding: 7px 10px; font-size: 15px; background: transparent; border: 1px solid transparent; border-radius: 4px;
}
.cmd-btn small { font-size: 11px; color: var(--ink-dim); white-space: nowrap; }
.cmd-btn::before { content: "▶"; color: var(--gold); font-size: 11px; margin-right: 2px; visibility: hidden; }
.cmd-btn:active, .cmd-btn:hover { background: rgba(143,184,255,.14); border-color: rgba(143,184,255,.4); }
.cmd-btn:hover::before, .cmd-btn:active::before { visibility: visible; }
.cmd-btn { justify-content: flex-start; }
.cmd-btn small { margin-left: auto; }
.cmd-btn:disabled { opacity: .4; }
.cmd-btn.back { color: var(--ink-dim); font-size: 13px; }
#bstatus { display: flex; flex-direction: column; justify-content: space-around; gap: 4px; padding: 6px 8px; overflow: hidden; }
.brow { display: flex; gap: 6px; align-items: center; padding: 3px 4px; border-radius: 4px; border: 1px solid transparent; }
.brow img { width: 34px; height: 34px; border-radius: 4px; border: 1px solid var(--edge); object-fit: cover; flex: none; }
.brow-body { flex: 1; min-width: 0; }
.brow-name { font-size: 12px; white-space: nowrap; }
.brow-line { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--ink-dim); }
.brow-line em { font-style: normal; font-size: 12px; color: var(--ink); width: 2.6em; text-align: right; font-variant-numeric: tabular-nums; }
.brow.active { border-color: var(--gold); background: rgba(255,215,94,.1); }
.brow.low .hpn { color: var(--gold); }
.brow.dead { opacity: .55; }
.brow.dead .hpn { color: var(--danger); }
.brow.dead img { filter: grayscale(1); }

/* ---------- オーバーレイ ---------- */
.overlay { position: absolute; inset: 0; z-index: 20; display: flex; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
#menu { background: rgba(4,9,24,.7); align-items: stretch; }
#menu .win { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 10px; gap: 10px; }
.menu-head { display: flex; justify-content: space-between; align-items: baseline; }
.menu-head h2 { margin: 0; font-size: 18px; font-weight: normal; letter-spacing: .1em; }
#menu-gold { color: var(--gold); }
.menu-scroll { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.card { display: flex; gap: 8px; padding: 8px; background: rgba(5,12,32,.45); border: 1px solid rgba(143,184,255,.35); border-radius: 4px; }
.card.dead { opacity: .6; }
.card .face { width: 64px; height: 64px; border-radius: 4px; border: 1px solid var(--edge); object-fit: cover; flex: none; }
.card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.card-head { display: flex; justify-content: space-between; }
.card-head b { font-weight: normal; font-size: 16px; }
.card-head span, .card-next { color: var(--gold); font-size: 12px; }
.card-job { font-size: 11px; color: var(--ink-dim); }
.stat-row { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.stat-row .num { width: 6.5em; text-align: right; font-variant-numeric: tabular-nums; }
.stat-grid { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; font-size: 11px; color: var(--ink-dim); }
.sec-title { font-size: 12px; color: var(--ink-dim); letter-spacing: .1em; margin-top: 4px; }
#menu-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.item-btn { display: grid; grid-template-columns: 1fr auto; text-align: left; gap: 0 6px; padding: 8px; background: rgba(5,12,32,.45); border: 1px solid rgba(143,184,255,.35); border-radius: 4px; }
.item-btn b { font-weight: normal; }
.item-btn small { grid-column: 1 / -1; color: var(--ink-dim); font-size: 11px; }
.item-btn:disabled { opacity: .4; }
/* お店（MOTHER 風の黒いまど） */
#shop { background: rgba(4,9,24,.55); align-items: stretch; }
.shop-win { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 10px; gap: 8px;
  background: #101018; border: 3px solid #f4f0e8; border-radius: 10px; box-shadow: 0 0 0 3px #101018, 0 6px 0 rgba(0,0,0,.35); }
.shop-talk { margin: 0; padding: 8px 10px; background: #f4f0e8; color: #201c28; border-radius: 6px; font-size: 14px; white-space: pre-line; min-height: 2.9em; }
.shop-tabs { display: flex; gap: 6px; }
.tab { flex: 1; padding: 8px; font-size: 15px; background: transparent; border: 2px solid #5a5868; border-radius: 6px; color: var(--ink-dim); }
.tab.on { border-color: var(--gold); color: var(--gold); background: rgba(255,215,94,.08); }
#shop-list { gap: 6px; }
.goods { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; padding: 8px 10px; background: #1c1c2a; border: 2px solid #34344a; border-radius: 6px; }
.goods.on { border-color: var(--gold); background: #2a2614; }
.goods.poor .goods-price { color: var(--danger); }
.goods-name { font-size: 15px; }
.goods-price { color: var(--gold); font-variant-numeric: tabular-nums; }
.goods small { grid-column: 1 / -1; color: var(--ink-dim); font-size: 11px; }
.empty { color: var(--ink-dim); font-size: 13px; text-align: center; margin: 20px 0; }
.shop-detail { min-height: 4.6em; padding: 6px 8px; border-top: 1px dashed #5a5868; font-size: 12px; color: var(--ink); }
.shop-detail .hint { color: var(--ink-dim); }
.compare { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; }
.compare li { display: flex; flex-wrap: wrap; gap: 0 6px; }
.compare b { font-weight: normal; color: var(--ink-dim); min-width: 3em; }
.compare .up { color: #7dff8a; }
.compare .down { color: var(--danger); }
.compare .ng { color: #6a6878; }
.btn.primary { border-color: var(--gold); }
.btn:disabled { opacity: .4; }
.card { cursor: pointer; }
.card-equip { display: flex; flex-wrap: wrap; gap: 0 10px; font-size: 11px; color: var(--ink); }
#menu-note { min-height: 1.4em; color: var(--gold); font-size: 13px; }
.menu-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1; padding: 10px 12px; font-size: 15px; background: var(--panel-2); border: 2px solid var(--edge); border-radius: 6px; min-width: 6em; }
.btn:active { background: #24489a; }
#dialog { align-items: flex-end; z-index: 30; pointer-events: none; }
#dialog .win { width: 100%; padding: 14px; display: flex; flex-direction: column; gap: 12px; pointer-events: auto; margin-bottom: env(safe-area-inset-bottom, 0px); }
#dialog-text { margin: 0; white-space: pre-line; font-size: 15px; }
#dialog-btns { display: flex; flex-direction: column; gap: 6px; }
#dialog-btns .btn { text-align: left; }

#title { z-index: 40; flex-direction: column; justify-content: center; align-items: center; gap: 22px; text-align: center;
  background: linear-gradient(180deg, rgba(11,23,54,.25) 0%, rgba(11,23,54,.85) 55%, var(--night) 100%), url("assets/img/bg_sky.png") center top / cover no-repeat, var(--night); }
#title h1 { margin: 0; font-weight: normal; font-size: clamp(24px, 8vw, 40px); letter-spacing: .04em; white-space: nowrap; text-shadow: 0 3px 0 #050b1c, 0 0 18px rgba(143,184,255,.7); text-wrap: balance; }
#title .sub { font-size: 12px; letter-spacing: .3em; color: var(--gold); margin-top: 4px; }
.title-faces { display: flex; gap: 8px; }
.title-faces img { width: 60px; height: 60px; border-radius: 6px; border: 2px solid var(--edge); object-fit: cover; box-shadow: 0 0 0 2px #050b1c; }
#title-btns { display: flex; flex-direction: column; gap: 10px; width: min(260px, 100%); }
#title-btns .btn { font-size: 17px; padding: 12px; }
.title-note { font-size: 11px; color: var(--ink-dim); max-width: 22em; }

#fade, #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 50; }
#fade { background: #000; transition: opacity .35s; }
#fade.on { opacity: 1; }
#flash { background: #fff; }
#flash.on { opacity: .85; }
@media (prefers-reduced-motion: reduce) { #msg.wait::after { animation: none; } .bar b { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <section id="field-view" class="view" hidden>
    <div id="hud" class="win">
      <div id="hud-party"></div>
      <div class="hud-line"><span><span id="zone-name">城の周辺</span><span id="zone-danger">★☆☆</span></span><span id="gold">0 G</span></div>
    </div>
    <div id="field-wrap"><canvas id="field" width="704" height="704"></canvas><div id="toast" hidden></div></div>
    <div id="controls">
      <div id="dpad" aria-label="移動パッド"><span class="u"></span><span class="d"></span><span class="l"></span><span class="r"></span></div>
      <div class="side-btns">
        <button id="btn-menu" class="round">メニュー</button>
        <button id="btn-dash" class="round small">ダッシュ</button>
      </div>
    </div>
  </section>

  <section id="battle-view" class="view" hidden>
    <div id="battle-wrap"><canvas id="battle" width="704" height="580"></canvas></div>
    <div id="msg" class="win"></div>
    <div id="bpanel">
      <div id="cmd" class="win"></div>
      <div id="bstatus" class="win"></div>
    </div>
  </section>

  <div id="menu" class="overlay" hidden>
    <div class="win">
      <div class="menu-head"><h2>メニュー</h2><span id="menu-gold">0 G</span></div>
      <div class="menu-scroll">
        <div id="menu-status"></div>
        <div class="sec-title">キャラクターを タップすると そうびを かえられます</div>
        <div class="sec-title">アイテム（タップで使う）</div>
        <div id="menu-items"></div>
      </div>
      <div id="menu-note"></div>
      <div class="menu-actions">
        <button id="btn-save" class="btn">セーブ</button>
        <button id="btn-sound" class="btn">効果音：ON</button>
        <button id="btn-close" class="btn">とじる</button>
      </div>
    </div>
  </div>

  <div id="shop" class="overlay" hidden>
    <div class="win shop-win">
      <div class="menu-head"><h2 id="shop-name">お店</h2><span id="shop-gold">0 G</span></div>
      <p id="shop-talk" class="shop-talk"></p>
      <div class="shop-tabs">
        <button id="tab-buy" class="tab on">かう</button>
        <button id="tab-sell" class="tab">うる</button>
      </div>
      <div id="shop-list" class="menu-scroll"></div>
      <div id="shop-detail" class="shop-detail"></div>
      <div class="menu-actions">
        <button id="btn-shop-act" class="btn primary">かう</button>
        <button id="btn-shop-exit" class="btn">みせを でる</button>
      </div>
    </div>
  </div>

  <div id="dialog" class="overlay" hidden>
    <div class="win"><p id="dialog-text"></p><div id="dialog-btns"></div></div>
  </div>

  <div id="title" class="overlay">
    <div>
      <h1>エクリプス・サーガ</h1>
      <div class="sub">ORIGINAL 16BIT RPG</div>
    </div>
    <div class="title-faces">
      <img src="assets/img/leon_face.png" alt="レオン">
      <img src="assets/img/selena_face.png" alt="セレナ">
      <img src="assets/img/garo_face.png" alt="ガロ">
      <img src="assets/img/noa_face.png" alt="ノア">
    </div>
    <div id="title-loading">よみこみ中…</div>
    <div id="title-btns" hidden>
      <button id="btn-new" class="btn">はじめから</button>
      <button id="btn-continue" class="btn" hidden>つづきから</button>
    </div>
    <p class="title-note">暫定版：フィールド探索とバトルまで。音が出ます。</p>
  </div>

  <div id="flash"></div>
  <div id="fade"></div>
</div>
<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/town.js"></script>
<script src="js/game.js"></script>
</body>
</html>
